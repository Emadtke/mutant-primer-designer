<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在浏览器本地完成质粒图谱定点突变和引物设计。">
  <meta name="theme-color" content="#f4f2ea">
  <title>Mutant Primer Designer</title>
  <style>:root {
  --ink: #122c2b;
  --muted: #60706d;
  --paper: #f4f2ea;
  --card: #fffdf7;
  --teal: #0b5b55;
  --teal-bright: #167b70;
  --mint: #d9eee5;
  --lime: #d9f071;
  --line: #d9ded6;
  --danger: #9f3f36;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-geist-sans), "Microsoft YaHei", sans-serif; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
main { min-height: 100vh; overflow: hidden; }

.topbar { height: 72px; padding: 0 clamp(22px, 5vw, 76px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(18, 44, 43, .14); }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-weight: 760; letter-spacing: -.02em; }
.brand-symbol { width: 28px; height: 30px; display: flex; align-items: center; justify-content: space-between; transform: rotate(-7deg); }
.brand-symbol i { width: 5px; height: 23px; border-radius: 5px; background: var(--teal); display: block; }
.brand-symbol i:nth-child(2) { height: 30px; background: var(--lime); }
.privacy { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.privacy span { width: 8px; height: 8px; background: #4da56d; border-radius: 50%; box-shadow: 0 0 0 4px rgba(77,165,109,.12); }

.hero { max-width: 1180px; margin: 0 auto; padding: 92px 36px 64px; position: relative; }
.hero::after { content: "A  T  G  C  G  C"; position: absolute; right: 20px; top: 52px; color: rgba(11,91,85,.07); font: 700 clamp(42px, 8vw, 102px)/1 var(--font-geist-mono), monospace; letter-spacing: .06em; writing-mode: vertical-rl; pointer-events: none; }
.eyebrow, .section-kicker { color: var(--teal-bright); font-size: 11px; font-weight: 760; letter-spacing: .18em; text-transform: uppercase; }
.hero h1 { font-size: clamp(48px, 7vw, 86px); line-height: .99; letter-spacing: -.065em; max-width: 880px; margin: 20px 0 28px; font-weight: 620; }
.hero h1 em { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: var(--teal); }
.hero > p { max-width: 690px; color: var(--muted); font-size: 18px; line-height: 1.8; margin: 0; }
.hero-facts { display: flex; gap: 38px; margin-top: 44px; flex-wrap: wrap; color: #384c49; font-size: 13px; }
.hero-facts span { display: flex; align-items: center; gap: 10px; }
.hero-facts b { color: var(--teal); font: 700 11px/1 var(--font-geist-mono), monospace; }

.workflow-shell { max-width: 1120px; margin: 0 auto; padding: 0 36px 110px; }
.upload-card { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 30px; background: rgba(255,253,247,.72); border: 1px solid var(--line); border-bottom: 0; transition: .2s ease; }
.upload-card:first-child { border-radius: 22px 22px 0 0; }
.upload-card:nth-child(2) { border-bottom: 1px solid var(--line); border-radius: 0 0 22px 22px; }
.upload-card.is-ready { background: var(--card); }
.step-number { width: 44px; height: 44px; border: 1px solid #b9c8c1; border-radius: 50%; display: grid; place-items: center; font: 650 13px/1 var(--font-geist-mono), monospace; color: var(--teal); }
.upload-copy h2 { font-size: 19px; margin: 0 0 7px; letter-spacing: -.025em; }
.upload-copy > p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.55; }
.file-pill { margin-top: 13px; display: flex; align-items: center; gap: 10px; width: fit-content; padding: 8px 12px 8px 8px; background: var(--mint); border-radius: 10px; }
.file-pill .file-mark { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 7px; background: var(--teal); color: white; font-size: 13px; }
.file-pill > span:last-child { display: flex; gap: 12px; align-items: baseline; }
.file-pill strong { font-size: 12px; }
.file-pill small { color: var(--muted); font-size: 10px; }
.secondary-button { border: 1px solid #b9c8c1; background: transparent; color: var(--teal); font-weight: 650; border-radius: 999px; padding: 10px 18px; font-size: 13px; transition: .18s; }
.secondary-button:hover { background: var(--teal); color: #fff; border-color: var(--teal); }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.analysis-panel { margin-top: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(24px, 4vw, 46px); box-shadow: 0 20px 60px rgba(21,63,57,.07); }
.panel-heading, .results-heading { display: flex; justify-content: space-between; gap: 28px; align-items: flex-end; }
.panel-heading h2, .results-heading h2 { margin: 8px 0 0; font-size: clamp(27px, 4vw, 40px); letter-spacing: -.05em; }
.plasmid-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.plasmid-meta span { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 11px; }
.analysis-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; margin-top: 34px; }
.target-card, .mutation-card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: #fbfaf4; }
label, .field-label-row span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 730; color: var(--muted); }
select { display: block; width: 100%; margin-top: 10px; padding: 13px 14px; border: 1px solid #c9d1ca; border-radius: 10px; background: white; color: var(--ink); outline: none; }
select:focus, textarea:focus, input:focus { border-color: var(--teal-bright); box-shadow: 0 0 0 3px rgba(22,123,112,.12); outline: none; }
.empty-target { margin-top: 10px; padding: 14px; border: 1px dashed #c4ccc5; border-radius: 10px; background: #f1f2ec; color: var(--muted); font-size: 12px; }
.target-stats { display: flex; flex-wrap: wrap; gap: 18px; margin: 18px 0 14px; color: var(--muted); font-size: 11px; }
.target-stats b { color: var(--ink); font-size: 13px; }
.protein-sequence { height: 82px; overflow: auto; padding: 12px; border-radius: 9px; background: #eef1eb; color: #304c47; font: 11px/1.7 var(--font-geist-mono), monospace; overflow-wrap: anywhere; letter-spacing: .045em; }
.field-label-row { display: flex; justify-content: space-between; }
.field-label-row span { color: var(--teal-bright); }
textarea { width: 100%; height: 160px; margin-top: 10px; resize: vertical; padding: 13px 14px; border: 1px solid #c9d1ca; border-radius: 10px; background: white; color: var(--ink); outline: none; font: 600 13px/1.75 var(--font-geist-mono), monospace; }
.mutation-card > p { color: var(--muted); font-size: 11px; margin: 9px 0 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.checks > span { display: inline-flex; gap: 7px; align-items: center; padding: 8px 10px; border-radius: 9px; font: 650 11px/1 var(--font-geist-mono), monospace; }
.checks small { font: 400 10px/1 var(--font-geist-sans), sans-serif; opacity: .76; }
.check-ok { background: #e2f1e6; color: #256743; }
.check-error { background: #f8e4df; color: var(--danger); }
.checks b { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: currentColor; color: white; font-size: 9px; }
.design-options { display: grid; grid-template-columns: 1.6fr .7fr .7fr; gap: 14px; margin-top: 24px; padding: 20px; border: 1px solid var(--line); border-radius: 15px; background: #fbfaf4; }
.design-option { display: flex; flex-direction: column; gap: 9px; }
.design-option select, .design-option input { width: 100%; min-height: 45px; margin: 0; padding: 11px 13px; border: 1px solid #c9d1ca; border-radius: 10px; background: white; color: var(--ink); }
.design-option input { font: 650 14px/1 var(--font-geist-mono), monospace; }
.primer-method { display: grid; grid-template-columns: minmax(230px, .8fr) 1fr; gap: 25px; align-items: center; margin: 26px 0; padding: 22px; border: 1px dashed #aebdb4; border-radius: 15px; background: #f7f7ef; }
.primer-method strong { font-size: 14px; }
.primer-method p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.primer-diagram { height: 54px; position: relative; display: grid; grid-template-columns: auto 3fr auto 4fr auto; align-items: center; gap: 5px; font: 600 10px/1 var(--font-geist-mono), monospace; color: var(--muted); }
.primer-diagram i { height: 2px; background: var(--teal); position: relative; }
.line-after::after { content: ""; position: absolute; right: -1px; top: -3px; border-left: 7px solid var(--teal); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.mutation-block { background: var(--lime); color: var(--ink); height: 27px; padding: 0 8px; display: grid; place-items: center; border-radius: 5px; }
.primary-button { width: 100%; border: 0; border-radius: 13px; background: var(--teal); color: white; padding: 17px 20px; display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 700; transition: .18s; }
.primary-button:hover:not(:disabled) { background: #074b46; transform: translateY(-1px); }
.primary-button:disabled { opacity: .38; cursor: not-allowed; }
.primary-button span { font-size: 20px; }
.status-message { margin-top: 16px; border-radius: 12px; padding: 14px 17px; background: #f7e2dd; color: var(--danger); font-size: 13px; }
.status-message.success { background: #dceee3; color: #23623f; }

.results { background: var(--ink); color: #f8f5ea; padding: 92px max(36px, calc((100vw - 1048px)/2)) 108px; }
.results-heading p { color: #aebebb; margin: 10px 0 0; font-size: 13px; }
.download-button { display: inline-flex; align-items: center; gap: 9px; border: 0; border-radius: 999px; background: var(--lime); color: var(--ink); padding: 13px 19px; font-weight: 760; white-space: nowrap; }
.download-button span { font-size: 18px; }
.result-list { display: grid; gap: 18px; margin-top: 40px; }
.result-card { border: 1px solid rgba(255,255,255,.15); border-radius: 17px; background: rgba(255,255,255,.045); overflow: hidden; }
.result-title { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 15px; align-items: center; padding: 20px; }
.mutation-badge { padding: 10px 12px; border-radius: 8px; background: var(--lime); color: var(--ink); font: 760 13px/1 var(--font-geist-mono), monospace; }
.result-title h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.result-title p { color: #9eb0ad; margin: 6px 0 0; font-size: 11px; }
.result-title button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: white; border-radius: 999px; padding: 8px 12px; font-size: 11px; }
.codon-change { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(0,0,0,.15); font: 650 13px/1 var(--font-geist-mono), monospace; }
.codon-change span { text-decoration: line-through; color: #9fb0ad; }
.codon-change strong { color: var(--lime); font-size: 16px; }
.codon-change small { color: #8ea29e; margin-left: auto; font: 400 10px/1 var(--font-geist-sans), sans-serif; }
.primer-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 790px; }
th, td { padding: 14px 20px; text-align: left; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; }
th { color: #93a8a4; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
td code { color: #e8f8b0; font: 10.5px/1 var(--font-geist-mono), monospace; letter-spacing: .035em; }
footer { padding: 30px clamp(22px, 5vw, 76px); display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 11px; }
footer span { color: var(--ink); font-weight: 750; }
footer p { margin: 0; }

@media (max-width: 780px) {
  .topbar { height: 62px; }
  .privacy { font-size: 0; }
  .hero { padding: 68px 22px 46px; }
  .hero::after { display: none; }
  .hero h1 { font-size: 48px; }
  .hero > p { font-size: 15px; }
  .workflow-shell { padding: 0 16px 76px; }
  .upload-card { grid-template-columns: 42px 1fr; padding: 22px 18px; gap: 12px; }
  .upload-card .secondary-button { grid-column: 2; justify-self: start; }
  .analysis-panel { padding: 22px 16px; }
  .panel-heading, .results-heading { align-items: flex-start; flex-direction: column; }
  .plasmid-meta { justify-content: flex-start; }
  .analysis-grid { grid-template-columns: 1fr; }
  .design-options { grid-template-columns: 1fr 1fr; }
  .design-option:first-child { grid-column: 1 / -1; }
  .primer-method { grid-template-columns: 1fr; }
  .results { padding: 70px 16px; }
  .result-title { grid-template-columns: auto 1fr; }
  .result-title button { grid-column: 2; justify-self: start; }
  footer { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
